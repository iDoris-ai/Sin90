[package]
name = "sin90"
version = "0.5.1"
edition = "2021"
license = "Apache-2.0"
description = "Sin90 — 个人助理领域 OS，Agent24 的参考实现之一"
repository = "https://github.com/iDoris-ai/Sin90"

[[bin]]
name = "sin90"
path = "src/main.rs"

[lib]
name = "sin90"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
jiff = "0.2"
# Exact-pinned (M6, T3.1.1 review): Sin90's `Routine.cron`/`tz` validation
# (core::util::validate_cron/validate_tz) must use the SAME parser and the
# SAME tz database as Agent24's kernel scheduler — a different `cron` minor
# version can change ordinal semantics (H1 is exactly that class of bug) and
# a different `chrono-tz` release ships a different IANA tzdata snapshot.
# Bump these ONLY together with rust/crates/agent24-scheduler/Cargo.toml in
# the Agent24 repo, in the same change.
cron = "=0.15.0"
chrono-tz = "=0.10.4"
# ME4-5.2.1 (docs/design/ME4-S3-os-sdk.md §5.1): the out-of-process module
# SDK — replaces this crate's own hand-written adapter_agent24 transport/
# handshake/typed-client code. Pinned by tag, not branch, so Sin90's build is
# reproducible independent of Agent24's own main branch history; bump this
# tag deliberately, in its own commit, when picking up a newer SDK release
# (CHANGELOG.md in that crate lists the minimum agent24d version each tag
# needs).
agent24-os-sdk = { git = "https://github.com/iDoris-ai/Agent24", tag = "agent24-os-sdk-v0.1.0" }
# Deviation from the design's Cargo.toml row (§5.1's "不直接依赖 proto", L8):
# that note is scoped to the DEV-dependency (test-util forwarding, which is
# pure re-export and needs no type name). This ordinary dependency is a
# separate, mechanical requirement the design did not spell out: the SDK's
# own five client constructors are all `pub fn new(conn: &Arc<Connection>)`,
# and `agent24-os-proto::module::Connection` is never re-exported from the
# SDK's own crate root — so a NEWTYPE around `SchedulerClient`/`ModelClient`
# (kept specifically so `reconciler.rs`'s protected test module needs zero
# source changes, §5.2 point 3) cannot spell its own `new(conn: &Arc<???>)`
# parameter type without this crate naming `Connection` itself. Same git
# source and tag as the SDK above, so Cargo resolves to the exact same
# `agent24-os-proto` build (one copy in the dependency graph, not two).
agent24-os-proto = { git = "https://github.com/iDoris-ai/Agent24", tag = "agent24-os-sdk-v0.1.0" }

[features]
test-hooks = []
# T5.1.2 (DESIGN-LIFEOS.md §11.3.2 / §2 #26): swaps `ai::ports::MANIFEST_YAML`'s
# `include_str!` target to `domain-os.remote-allowed.yml` — the ONLY manifest
# text allowed to declare `model_access: remote_allowed`. Test package B only
# (J16/J23); the official package never enables this.
remote-allowed-manifest = []

[dev-dependencies]
# L8 (§5.1 Cargo.toml row): forwards the SDK's own `test-util` feature
# (proto's in-memory fake kernel, `module::testing`, re-exported as
# `agent24_os_sdk::testing`) — this crate's dev-dependencies only ever need
# to name the SDK, not `agent24-os-proto` directly. Cargo unions this
# feature into the ordinary dependency above, the same pattern this
# Cargo.toml already uses for `tokio`'s `test-util` feature just below.
agent24-os-sdk = { git = "https://github.com/iDoris-ai/Agent24", tag = "agent24-os-sdk-v0.1.0", features = ["test-util"] }
# L2 (2026-09-26 review): `#[tokio::test(start_paused = true)]` +
# `tokio::time::{advance, pause}` — `model::ModelClient`'s own 125s-timeout
# test drives the virtual clock instead of a real 125-second sleep. Cargo
# unions this feature into the main `tokio` dependency ONLY for test builds
# (dev-dependency feature additions don't leak into a normal build).
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
rustix = { version = "0.38", features = ["process"] }
# Test-only: `core::util`'s cron-semantics tests (H1) construct a fixed
# `DateTime<Tz>` and iterate a `cron::Schedule` to prove which weekday a
# named specifier actually fires on. Not a runtime dependency — Sin90 never
# computes a next-fire itself (the kernel scheduler does).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Test-only (T5.1.1, design §11.5): `tests/ai_boundary.rs`'s syn-based
# whitelist walk over `src/ai/**/*.rs` (J7). Deliberately NOT a normal
# dependency and NOT in `ai/`'s own allowed-external-crate list — the
# checker cannot live inside `ai/` without failing its own check.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

