[package]
name = "sin90"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Sin90 — 个人助理领域 OS，Agent24 的参考实现之一"
repository = "https://github.com/iDoris-ai/Sin90"

[[bin]]
name = "sin90"
path = "src/main.rs"

[lib]
name = "sin90"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
jiff = "0.2"
# Exact-pinned (M6, T3.1.1 review): Sin90's `Routine.cron`/`tz` validation
# (core::util::validate_cron/validate_tz) must use the SAME parser and the
# SAME tz database as Agent24's kernel scheduler — a different `cron` minor
# version can change ordinal semantics (H1 is exactly that class of bug) and
# a different `chrono-tz` release ships a different IANA tzdata snapshot.
# Bump these ONLY together with rust/crates/agent24-scheduler/Cargo.toml in
# the Agent24 repo, in the same change.
cron = "=0.15.0"
chrono-tz = "=0.10.4"

[features]
test-hooks = []

[dev-dependencies]
# L2 (2026-09-26 review): `#[tokio::test(start_paused = true)]` +
# `tokio::time::{advance, pause}` — `model::ModelClient`'s own 125s-timeout
# test drives the virtual clock instead of a real 125-second sleep. Cargo
# unions this feature into the main `tokio` dependency ONLY for test builds
# (dev-dependency feature additions don't leak into a normal build).
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
rustix = { version = "0.38", features = ["process"] }
# Test-only: `core::util`'s cron-semantics tests (H1) construct a fixed
# `DateTime<Tz>` and iterate a `cron::Schedule` to prove which weekday a
# named specifier actually fires on. Not a runtime dependency — Sin90 never
# computes a next-fire itself (the kernel scheduler does).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Test-only (T5.1.1, design §11.5): `tests/ai_boundary.rs`'s syn-based
# whitelist walk over `src/ai/**/*.rs` (J7). Deliberately NOT a normal
# dependency and NOT in `ai/`'s own allowed-external-crate list — the
# checker cannot live inside `ai/` without failing its own check.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

