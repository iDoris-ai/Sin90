name: CI

# 不按 branches 过滤 base：这个仓库大量用 stacked PR，base 常常是别的 feature
# 分支而不是 main，过滤了就会有一批 PR 拿不到 CI。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一个 PR/分支的旧运行作废，省 runner 时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
