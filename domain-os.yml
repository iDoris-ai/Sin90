# Sin90 的领域 OS 清单（design §5.4）。
#
# `name` 是身份的唯一来源 —— 命名空间、事件模块名、数据目录都由它派生。
#
# impl_kind 从 in_process_crate 改成了 out_of_process_provider（2026-09-20）：
# Agent24 的 ME-3 专项已于 2026-09-20 整体收口（T9/ME-3f 黑盒验收合入 main），
# 进程外挂载的阻塞条件已经解除，见 docs/STATUS.md。
name: sin90
version: "0.5.0"
route_namespace: /api/v1/sin90
event_module: sin90
data_dir: ~/.agent24/os/sin90/

requires_models: []
requires_apis: []
requires_deps: []

# 只写真正用到的。Sin90 只要 events：它自己管数据目录，不用内核记忆
# （design §5.3；这条决策继承自内核实现时代，未改变）。
kernel_capabilities: [events]

impl_kind: out_of_process_provider
spawn:
  command: bin/sin90
  args: ["module"]
